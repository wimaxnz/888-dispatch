<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Your Gift | 888 Grocery</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="common.css">
<style>
.wrap { max-width: 640px }
.hero { text-align: center; padding: 26px 18px 22px; background: linear-gradient(180deg, var(--gold-soft), var(--surface)); border: 1px solid var(--line); border-radius: 18px; display: grid; gap: 12px; justify-items: center }
.logo { max-width: 200px; max-height: 90px; object-fit: contain; background: #fff; border-radius: 12px; padding: 8px 12px }
.from { font: 700 12.5px var(--f-head); letter-spacing: .1em; text-transform: uppercase; color: var(--gold) }
.hero h1 { font-size: clamp(24px, 6vw, 32px); line-height: 1.15 }
.greet { white-space: pre-line; font-size: 16.5px; line-height: 1.55; max-width: 480px; margin: 0 }
.sign { font-style: italic; color: var(--muted); margin: 0 }
.value { display: inline-flex; gap: 8px; align-items: baseline; background: var(--brand); color: var(--brand-ink); padding: 8px 16px; border-radius: 999px; font-weight: 600 }
.value b { font: 800 20px var(--f-head) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px }
.it { display: grid; gap: 5px; font-size: 12px; line-height: 1.3; text-align: center }
.it img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 10px }
.it span { color: var(--muted) }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px }
form { display: grid; gap: 12px }
label { display: grid; gap: 5px; font-weight: 600; font-size: 14px }
label small { font-weight: 400; color: var(--muted) }
input, textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px }
textarea { min-height: 70px; resize: vertical; font: inherit }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
@media (max-width: 480px) { .two { grid-template-columns: 1fr } }
.big { width: 100%; font-size: 17px; min-height: 54px }
.err { color: var(--bad); background: var(--bad-soft); padding: 10px 12px; border-radius: 10px; margin: 0 }
.done { text-align: center; background: var(--ok-soft); border-color: var(--ok) }
.done h2 { color: var(--ok) }
.muted { color: var(--muted); font-size: 13.5px; margin: 0 }
.center { text-align: center }
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><img src="logo.png" alt="888 Grocery"></div></header>
<div class="wrap"><main id="view"><div class="card center"><p class="muted">Opening your gift…</p></div></main></div>
<datalist id="provinces">__PROVINCES__</datalist>
<script>
const API = '__API__';
const hash = new URLSearchParams(location.hash.slice(1));
const T = hash.get('t') || new URLSearchParams(location.search).get('t') || '';
const view = document.getElementById('view');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const peso = (n) => '₱' + Math.round(n).toLocaleString('en-PH');
const day = (iso) => new Date(iso).toLocaleDateString('en-PH', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Manila' });
let V = null;

function hero(v) {
  const name = v.staffName ? `For ${esc(v.staffName)} and family` : 'For you and your family';
  return `<section class="hero">
    ${v.logo ? `<img class="logo" src="${esc(v.logo)}" alt="${esc(v.company)}">` : ''}
    <div class="from">A gift from ${esc(v.company)}</div>
    <h1>${name}</h1>
    ${v.greeting ? `<p class="greet">${esc(v.greeting)}</p>` : ''}
    ${v.signOff ? `<p class="sign">${esc(v.signOff)}</p>` : ''}
    <div class="value">Gift value <b>${peso(v.valuePhp)}</b> · delivered free</div>
  </section>`;
}
function packCard(v) {
  return `<section class="card">
    <h2>Your grocery gift pack</h2>
    <p class="muted">${v.pack.lines.reduce((t, l) => t + l.qty, 0)} items, about ${Math.round(v.pack.kg)} kg, delivered to any address in the Philippines.</p>
    <div class="grid">${v.pack.lines.map((l) => `<div class="it">${l.image ? `<img loading="lazy" src="${esc(l.image + (l.image.includes('?') ? '&' : '?') + 'width=200')}" alt="">` : ''}<div>${esc(l.title)}${l.qty > 1 ? ` <span>× ${l.qty}</span>` : ''}</div></div>`).join('')}</div>
    <p class="muted">If an item is out of stock, we replace it with one of equal or higher value.</p>
  </section>`;
}
function form(msg) {
  return `<section class="card" id="send">
    <h2>Where should we deliver it?</h2>
    <ol class="steps"><li>Enter who will receive the gift and their address.</li><li>Tap <b>Send my gift</b>. That's all, there's nothing to pay.</li></ol>
    ${msg ? `<p class="err" role="alert">${esc(msg)}</p>` : ''}
    <form id="f" novalidate>
      <label>Name of the person receiving it <input name="name" autocomplete="name" required></label>
      <label>Their mobile number <small>The courier will text or call this number.</small><input name="phone" type="tel" inputmode="tel" placeholder="0917 123 4567" autocomplete="tel" required></label>
      <label>House no., street, purok or subdivision <input name="address" autocomplete="address-line1" required></label>
      <label>Barangay <input name="barangay"></label>
      <div class="two">
        <label>City or town <input name="city" autocomplete="address-level2" required></label>
        <label>Province <input name="province" list="provinces" autocomplete="address-level1" required></label>
      </div>
      <label>Landmark or note for the courier <small>Optional</small><textarea name="note" maxlength="200"></textarea></label>
      <button class="btn primary big" id="go">Send my gift</button>
      <p class="muted center">Please choose your delivery by <b>${day(V.packUntil)}</b>. After that, the full value stays with you as 888 Grocery shop credit that never expires.</p>
    </form>
  </section>`;
}
function render(msg) {
  const v = V;
  let body = '';
  if (v.state === 'pack') body = packCard(v) + form(msg);
  else if (v.state === 'redeemed') body = `<section class="card done"><h2>Your gift is on its way</h2>
    <p>We're preparing the pack for <b>${esc(v.redeemed?.to)}</b>${v.redeemed?.city ? ` in ${esc(v.redeemed.city)}` : ''}. The courier will text before delivery.</p>
    <p class="muted">Voucher ${esc(v.code)} · sent ${day(v.redeemed?.at)}</p></section>` + packCard(v);
  else if (v.state === 'credit') body = `<section class="card"><h2>Your gift is now shop credit</h2>
    <p>The time to claim the pack has passed, so the full value of <b>${peso(v.valuePhp)}</b> stays with you as 888 Grocery shop credit. It never expires.</p>
    <p>Message us with your voucher code <b>${esc(v.code)}</b> and we'll help you choose your groceries.</p>
    <a class="btn primary big" href="https://888grocery.com/pages/contact" style="text-align:center;text-decoration:none">Contact 888 Grocery</a></section>`;
  else if (v.state === 'cancelled') body = `<section class="card"><h2>This voucher was replaced</h2><p>Please use the newest link you received, or ask ${esc(v.company)} to send it again.</p></section>`;
  else body = `<section class="card"><h2>Almost ready</h2><p>This gift will open soon. Please check the link again in a little while.</p></section>`;
  view.innerHTML = hero(v) + body + `<p class="muted center">Voucher ${esc(v.code)} · <a href="https://888grocery.com">888 Grocery</a>, groceries delivered to families across the Philippines.</p>`;
  const f = document.getElementById('f');
  if (f) f.addEventListener('submit', send);
}
async function send(e) {
  e.preventDefault();
  const f = e.target, btn = document.getElementById('go');
  const recipient = Object.fromEntries(new FormData(f));
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const res = await fetch(`${API}/voucher`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: T, recipient }) });
    const out = await res.json();
    if (out.ok) { V = out.view; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (out.view) V = out.view;
    render(out.reason || out.error || 'Something went wrong. Please try again.');
    const again = document.getElementById('f');
    if (again) { for (const [k, val] of Object.entries(recipient)) if (again.elements[k]) again.elements[k].value = val; document.getElementById('send').scrollIntoView(); }
  } catch {
    btn.disabled = false; btn.textContent = 'Send my gift';
    alert('No connection. Please check your internet and try again.');
  }
}
(async () => {
  if (!T) { view.innerHTML = '<div class="card"><h2>Gift link missing</h2><p>Please open the full link from your voucher, or scan its QR code.</p></div>'; return; }
  try {
    const res = await fetch(`${API}/voucher?t=${encodeURIComponent(T)}`);
    const out = await res.json();
    if (!res.ok) { view.innerHTML = `<div class="card"><h2>Gift not found</h2><p>${esc(out.error)}</p></div>`; return; }
    V = out; document.title = `A gift from ${V.company} | 888 Grocery`; render();
  } catch { view.innerHTML = '<div class="card"><h2>No connection</h2><p>Please check your internet and open the link again.</p></div>'; }
})();
</script>
</body>
</html>
