<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>888 Company Vouchers</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
.wrap { max-width: 1040px }
.role { font: 700 13px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: #dcae5e }
.top a { color: var(--brand-ink); margin-left: auto; font-size: 14px }
form, .stack { display: grid; gap: 12px }
label { display: grid; gap: 5px; font-weight: 600; font-size: 14px; min-width: 0 }
label small { font-weight: 400; color: var(--muted) }
input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 15px }
textarea { min-height: 90px; resize: vertical; font: inherit }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.muted { color: var(--muted); font-size: 13.5px; margin: 0 }
.table { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 13.5px }
th { text-align: left; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
.r { text-align: right }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--soft); border: 1px solid var(--line) }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent }
.pill.info { background: var(--info-soft); color: var(--info); border-color: transparent }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px }
.tile { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px }
.tile small { display: block; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted) }
.tile b { display: block; font: 800 22px var(--f-head) }
.packlist { columns: 2 260px; margin: 0; padding-left: 18px; font-size: 14px }
.logo-prev { max-height: 60px; max-width: 180px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 4px }
.err { color: var(--bad); background: var(--bad-soft); padding: 10px 12px; border-radius: 10px; margin: 0 }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 9 }
@media print {
  .top, main > *:not(#print), .toast { display: none !important }
  body { background: #fff } main { padding: 0 }
}
#print { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10mm }
#print:empty { display: none }
.vcard { break-inside: avoid; border: 2px solid #a8741f; border-radius: 14px; padding: 14px; display: grid; gap: 8px; color: #2a1c13; background: #fffaf2; text-align: center }
.vcard img.lg { max-height: 48px; max-width: 160px; justify-self: center }
.vcard .t { font: 800 17px var(--f-head) }
.vcard .g { font-size: 12px; line-height: 1.4; white-space: pre-line }
.vcard .q { justify-self: center } .vcard .q svg { width: 120px; height: 120px; display: block }
.vcard .c { font: 700 13px ui-monospace, monospace; letter-spacing: .08em }
.vcard .s { font-size: 11px; color: #76675b }
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><img src="logo.png" alt="888 Grocery"><span class="role">Company vouchers</span><a href="admin.html">Dispatch admin</a></div></header>
<div class="wrap"><main id="view"></main></div>
<div class="toast" id="toast" hidden></div>
<script>
const API = 'https://jssnhzkyhtobhuogddeq.supabase.co/functions/v1/api';
const GIFT = 'https://888grocery.com/pages/gift';
const view = document.getElementById('view');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const peso = (n) => '₱' + Math.round(n).toLocaleString('en-PH');
const nzd = (n) => 'NZ$' + Number(n).toLocaleString('en-NZ', { maximumFractionDigits: 2 });
const day = (iso) => iso ? new Date(iso).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const money = (n, cur) => new Intl.NumberFormat('en', { style: 'currency', currency: cur || 'NZD', maximumFractionDigits: 2 }).format(n);
const each = (b) => b.amount_local ? money(b.amount_local, b.currency) : nzd(b.budget_nzd);
const whole = (b) => b.amount_local ? money(b.amount_local * b.qty, b.currency) : nzd(b.qty * b.budget_nzd);
const link = (token) => `${GIFT}#t=${token}`;
const STATE = { pack: ['Waiting', 'warn'], redeemed: ['Sent', 'ok'], credit: ['Shop credit', 'info'], not_active: ['Not paid yet', ''], cancelled: ['Cancelled', ''] };
const DEFAULT_GREETING = `Maligayang Pasko! Thank you for the hard work and care you bring to our team every day. We know your loved ones support you from home, so this Christmas we'd like to share a little of our thanks with them too.`;
let KEY = null; try { KEY = localStorage.getItem('888-admin-key'); } catch {}
let DATA = null, OPEN = null, PREVIEW = null, LOGO = null;

function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
async function api(method, body, query = '') {
  const res = await fetch(`${API}/vadmin${query}`, { method, headers: { 'content-type': 'application/json', 'x-admin-key': KEY }, body: body ? JSON.stringify(body) : undefined });
  const out = await res.json().catch(() => ({ error: 'Server error' }));
  if (res.status === 403) { logout('That admin key did not work.'); throw new Error('key'); }
  if (!res.ok) throw new Error(out.error || 'Server error');
  return out;
}
function logout(msg) { KEY = null; try { localStorage.removeItem('888-admin-key'); } catch {} loginView(msg); }
function loginView(msg) {
  view.innerHTML = `<section class="card" style="max-width:420px"><h2>Owner sign in</h2>${msg ? `<p class="err">${esc(msg)}</p>` : ''}
    <form id="login"><label>Admin key <small>Same key as the dispatch admin page.</small><input id="key" type="password" autocomplete="current-password" required></label>
    <button class="btn primary">Sign in</button></form></section>`;
  document.getElementById('login').onsubmit = async (e) => { e.preventDefault(); KEY = document.getElementById('key').value.trim(); try { localStorage.setItem('888-admin-key', KEY); } catch {} load(); };
}
async function load() { DATA = await api('GET'); if (OPEN) OPEN = await api('GET', null, `?batch=${encodeURIComponent(OPEN.batch.id)}`); render(); }

function newForm() {
  const d = DATA.defaults;
  return `<section class="card"><h2>New company vouchers</h2>
  <form id="nf">
    <div class="cols">
      <label>Company name <input name="company" required placeholder="Company name"></label>
      <label>Company logo <small>PNG or JPG</small><input name="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></label>
      <div id="logoPrev"></div>
    </div>
    <label>Greeting on the welcome page <textarea name="greeting">${esc(DEFAULT_GREETING)}</textarea></label>
    <label>Signed by <input name="signOff" placeholder="From all of us at the company"></label>
    <div class="cols">
      <label>Value per staff (NZ$) <input name="budgetNzd" type="number" min="${d.minNzd}" max="${d.maxNzd}" step="1" value="80" required></label>
      <label>Number of vouchers <input name="qty" type="number" min="1" max="2000" step="1" value="10" required></label>
      <label>NZ$1 = ₱ <small>today's rate</small><input name="nzdToPhp" type="number" step="0.01" value="${d.nzdToPhp}" required></label>
      <label>Delivery allowance ₱ <input name="deliveryPhp" type="number" step="1" value="${d.deliveryPhp}" required></label>
    </div>
    <label>Staff list <small>Optional. One per line: name, email or mobile. Puts their name on their voucher.</small><textarea name="staff" placeholder="Maria Santos, maria@example.com&#10;Jun Reyes, 021 555 0101"></textarea></label>
    <div class="acts"><button type="button" class="btn" id="pv">Preview the pack</button><button class="btn primary">Create vouchers</button></div>
    <div id="pvOut"></div>
  </form></section>`;
}
function packHtml(pack, budgetPhp, goodsPhp) {
  return `<div class="stack"><p class="muted">Value ${peso(budgetPhp)} = groceries ${peso(pack.total)} + delivery ${peso(budgetPhp - goodsPhp)}${pack.unused ? ` (₱${pack.unused.toFixed(0)} unused)` : ''} · about ${Math.round(pack.kg)} kg</p>
    <ol class="packlist">${pack.lines.map((l) => `<li>${l.qty > 1 ? `${l.qty} × ` : ''}${esc(l.title)} <span class="muted">${peso(l.price * l.qty)}</span></li>`).join('')}</ol></div>`;
}
function batchesHtml() {
  const f = DATA.forecast;
  return `<section class="card"><h2>Stock forecast</h2>
    <div class="tiles"><div class="tile"><small>Vouchers waiting</small><b>${f.open}</b></div><div class="tile"><small>Sent to families</small><b>${f.redeemed}</b></div><div class="tile"><small>Now shop credit</small><b>${f.credit}</b></div></div>
    ${f.items.length ? `<p class="muted">Items still owed if every waiting voucher is used:</p><div class="table"><table><thead><tr><th>Item</th><th class="r">Qty</th></tr></thead><tbody>${f.items.map((i) => `<tr><td>${esc(i.title)}</td><td class="r">${i.qty}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Nothing owed yet. Paid batches show here.</p>'}
  </section>
  <section class="card"><h2>Batches</h2>${DATA.batches.length ? `<div class="table"><table><thead><tr><th>Company</th><th>Value</th><th class="r">Vouchers</th><th class="r">Opened</th><th class="r">Sent</th><th>Status</th><th></th></tr></thead><tbody>
    ${DATA.batches.map((b) => `<tr><td><b>${esc(b.company)}</b><br><span class="muted">${esc(b.id)} · ${day(b.created_at)}</span></td><td>${each(b)} <span class="muted">(${peso(b.budget_php)})${b.source === 'self' ? '<br>bought online' : ''}</span></td>
    <td class="r">${b.qty}</td><td class="r">${b.opened}</td><td class="r">${b.redeemed}</td><td>${b.paid ? '<span class="pill ok">Paid</span>' : '<span class="pill warn">Awaiting payment</span>'}</td>
    <td><button class="btn small" data-open="${esc(b.id)}">Open</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No batches yet.</p>'}</section>`;
}
function batchHtml() {
  const { batch: b, vouchers } = OPEN;
  return `<section class="card"><div class="acts"><h2 style="margin-right:auto">${esc(b.company)}</h2><button class="btn small" id="close">Back to all</button></div>
    ${b.logo ? `<img class="logo-prev" src="${esc(b.logo)}" alt="">` : ''}
    <p class="muted">${b.qty} vouchers × ${each(b)} = <b>${whole(b)}</b>${b.source === 'self' ? ` · bought online by ${esc(b.buyer_name || '')} ${esc(b.buyer_email || '')}${b.shopify_order ? ' · order ' + esc(b.shopify_order) : ''}` : ' to invoice'} · each ${peso(b.budget_php)} · batch ${esc(b.id)}</p>
    ${b.paid ? `<p><span class="pill ok">Paid ${day(b.paid_at)}</span> The links are live. Packs can be claimed for 3 months from this date.</p>`
      : `<p class="err">Not paid yet. The links show "Almost ready" until you mark the batch as paid.</p><div class="acts"><button class="btn primary" id="paid">Mark as paid: links go live</button></div>`}
    <details><summary>Pack in every voucher (${b.pack.lines.length} lines, ${peso(b.pack.total)})</summary>${packHtml(b.pack, b.budget_php, b.budget_php - b.delivery_php)}</details>
    <details><summary>Edit greeting or logo</summary><form id="ef" class="stack"><label>Greeting <textarea name="greeting">${esc(b.greeting)}</textarea></label>
      <label>Signed by <input name="signOff" value="${esc(b.sign_off)}"></label><label>New logo <input name="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></label>
      <div class="acts"><button class="btn">Save</button></div></form></details>
    <div class="acts"><button class="btn" id="copyAll">Copy all links</button><button class="btn" id="csv">Download list (CSV)</button><button class="btn" id="printCards">Print voucher cards</button><a class="btn" href="${esc(link(vouchers[0]?.token))}" target="_blank" rel="noopener">See a welcome page</a></div>
    <div class="table"><table><thead><tr><th>Code</th><th>Staff</th><th>Status</th><th>Delivered to</th><th></th></tr></thead><tbody>
    ${vouchers.map((v) => { const [lbl, cls] = STATE[v.state] ?? [v.state, '']; return `<tr><td><code>${esc(v.code)}</code>${v.opened_at && v.state === 'pack' ? '<br><span class="muted">opened</span>' : ''}</td>
      <td>${esc(v.staff_name || '')}<br><span class="muted">${esc(v.staff_contact || '')}</span></td><td><span class="pill ${cls}">${lbl}</span></td>
      <td>${v.recipient ? `${esc(v.recipient.name)}<br><span class="muted">${esc(v.recipient.city)}, ${esc(v.recipient.province)}</span>` : ''}</td>
      <td><div class="acts">${v.state !== 'redeemed' && v.state !== 'cancelled' ? `<button class="btn small" data-copy="${esc(v.token)}">Copy link</button><button class="btn small" data-share="${esc(v.code)}">Share</button><button class="btn small" data-name="${esc(v.code)}">Name</button><button class="btn small danger" data-relink="${esc(v.code)}">New link</button>` : ''}</div></td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="muted">"New link" stops the old link working (use it if a voucher went to the wrong person).</p>
  </section><div id="print"></div>`;
}
function render() {
  view.innerHTML = OPEN ? batchHtml() : newForm() + batchesHtml();
  wire();
}
async function logoFrom(file) {
  if (!file) return null;
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = URL.createObjectURL(file); });
  const s = Math.min(1, 400 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  let url = c.toDataURL('image/png');
  if (url.length > 380000) url = c.toDataURL('image/jpeg', 0.85);
  return url;
}
function staffList(text) {
  return String(text || '').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => { const [name, ...rest] = l.split(','); return { name: name.trim(), contact: rest.join(',').trim() }; });
}
function wire() {
  const nf = document.getElementById('nf');
  if (nf) {
    nf.logoFile.onchange = async () => { LOGO = await logoFrom(nf.logoFile.files[0]); document.getElementById('logoPrev').innerHTML = LOGO ? `<img class="logo-prev" src="${LOGO}" alt="">` : ''; };
    document.getElementById('pv').onclick = async () => {
      const out = document.getElementById('pvOut'); out.innerHTML = '<p class="muted">Making the pack…</p>';
      const r = await api('POST', { act: 'preview', budgetNzd: nf.budgetNzd.value, nzdToPhp: nf.nzdToPhp.value, deliveryPhp: nf.deliveryPhp.value });
      out.innerHTML = r.ok ? packHtml(r.pack, r.budgetPhp, r.goodsPhp) : `<p class="err">${esc(r.reason)}</p>`;
    };
    nf.onsubmit = async (e) => {
      e.preventDefault();
      const staff = staffList(nf.staff.value);
      const qty = Math.max(Number(nf.qty.value), staff.length);
      const body = { act: 'create', company: nf.company.value, logo: LOGO, greeting: nf.greeting.value, signOff: nf.signOff.value,
        budgetNzd: Number(nf.budgetNzd.value), qty, nzdToPhp: Number(nf.nzdToPhp.value), deliveryPhp: Number(nf.deliveryPhp.value), staff };
      if (!confirm(`Create ${qty} vouchers of ${nzd(body.budgetNzd)} for ${body.company}? Total to invoice: ${nzd(qty * body.budgetNzd)}.`)) return;
      const r = await api('POST', body);
      if (!r.ok) { document.getElementById('pvOut').innerHTML = `<p class="err">${esc(r.reason)}</p>`; return; }
      LOGO = null; OPEN = await api('GET', null, `?batch=${encodeURIComponent(r.batchId)}`); await load(); toast('Vouchers created');
    };
  }
  view.querySelectorAll('[data-open]').forEach((b) => b.onclick = async () => { OPEN = await api('GET', null, `?batch=${encodeURIComponent(b.dataset.open)}`); render(); window.scrollTo(0, 0); });
  if (!OPEN) return;
  const b = OPEN.batch, vs = OPEN.vouchers;
  document.getElementById('close').onclick = () => { OPEN = null; render(); };
  const paid = document.getElementById('paid');
  if (paid) paid.onclick = async () => { if (!confirm(`Has ${b.company} paid ${whole(b)}? The links go live now.`)) return; await api('POST', { act: 'markPaid', batchId: b.id }); await load(); toast('Batch is live'); };
  document.getElementById('ef').onsubmit = async (e) => {
    e.preventDefault(); const f = e.target; const logo = await logoFrom(f.logoFile.files[0]);
    await api('POST', { act: 'editBatch', batchId: b.id, greeting: f.greeting.value, signOff: f.signOff.value, ...(logo ? { logo } : {}) }); await load(); toast('Saved');
  };
  const usable = vs.filter((v) => !['redeemed', 'cancelled'].includes(v.state));
  document.getElementById('copyAll').onclick = async () => { await navigator.clipboard.writeText(usable.map((v) => `${v.staff_name || v.code}: ${link(v.token)}`).join('\n')); toast(`${usable.length} links copied`); };
  document.getElementById('csv').onclick = () => {
    const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
    const rows = [['code', 'staff', 'contact', 'status', 'link'], ...vs.map((v) => [v.code, v.staff_name, v.staff_contact, (STATE[v.state] ?? [v.state])[0], v.state === 'redeemed' ? '' : link(v.token)])];
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map(q).join(',')).join('\n')], { type: 'text/csv' }));
    a.download = `${b.company.replace(/\W+/g, '-')}-vouchers.csv`; a.click();
  };
  document.getElementById('printCards').onclick = () => {
    const short = (b.greeting || '').length > 220 ? b.greeting.slice(0, 210).replace(/\s+\S*$/, '') + '…' : b.greeting;
    document.getElementById('print').innerHTML = usable.map((v) => {
      const qr = qrcode(0, 'M'); qr.addData(link(v.token)); qr.make();
      return `<div class="vcard">${b.logo ? `<img class="lg" src="${esc(b.logo)}" alt="">` : ''}<div class="t">A gift from ${esc(b.company)}</div>
        ${v.staff_name ? `<div>For ${esc(v.staff_name)} and family</div>` : ''}<div class="g">${esc(short)}</div>
        <div><b>${peso(b.budget_php)}</b> grocery gift pack · delivered free in the Philippines</div>
        <div class="q">${qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div><div class="c">${esc(v.code)}</div>
        <div class="s">Scan the code, enter the delivery address, done. Claim the pack within 3 months; after that the value stays as 888 Grocery credit that never expires.</div></div>`;
    }).join('');
    setTimeout(() => window.print(), 300);
  };
  view.querySelectorAll('[data-copy]').forEach((x) => x.onclick = async () => { await navigator.clipboard.writeText(link(x.dataset.copy)); toast('Link copied'); });
  view.querySelectorAll('[data-share]').forEach((x) => x.onclick = async () => {
    const v = vs.find((y) => y.code === x.dataset.share);
    const text = `${v.staff_name ? `Hi ${v.staff_name}! ` : ''}${b.company} has a Christmas grocery gift for your family in the Philippines. Open this link, add the delivery address, and 888 Grocery delivers it free: ${link(v.token)}`;
    if (navigator.share) { try { await navigator.share({ title: `A gift from ${b.company}`, text }); } catch {} }
    else { await navigator.clipboard.writeText(text); toast('Message copied: paste it into WhatsApp, Messenger or email'); }
  });
  view.querySelectorAll('[data-name]').forEach((x) => x.onclick = async () => {
    const v = vs.find((y) => y.code === x.dataset.name);
    const name = prompt('Staff name for this voucher', v.staff_name || ''); if (name === null) return;
    const contact = prompt('Email or mobile (optional)', v.staff_contact || ''); if (contact === null) return;
    await api('POST', { act: 'staff', code: v.code, name, contact }); await load();
  });
  view.querySelectorAll('[data-relink]').forEach((x) => x.onclick = async () => {
    if (!confirm('Make a new link? The old link stops working.')) return;
    const r = await api('POST', { act: 'newLink', code: x.dataset.relink }); if (!r.ok) return toast(r.reason); await load(); toast('New link made');
  });
}
if (KEY) load().catch((e) => { if (e.message !== 'key') view.innerHTML = `<p class="err">${esc(e.message)}</p>`; }); else loginView();
</script>
</body>
</html>
