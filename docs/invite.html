<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>888 Supplier Invites</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="common.css">
<style>
.wrap { max-width: 640px }
.role { font: 700 13px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: #dcae5e }
.steps-how { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14.5px }
.slot { display: grid; gap: 10px; margin-top: 14px }
.slot h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 17px }
.slot h3 small { font: 500 13px Inter, sans-serif; color: var(--muted) }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.row { display: flex; gap: 8px; flex-wrap: wrap }
.row .btn { flex: 1 1 140px }
.status { font-size: 14px; border-radius: 10px; padding: 8px 10px; background: var(--soft) }
.status.full { background: var(--ok-soft); color: var(--ok) }
.status.part { background: var(--gold-soft) }
.hint { font-size: 13px; color: var(--muted) }
.done { color: var(--ok); font-weight: 600; font-size: 14px }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr } }
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><img src="logo.png" alt="888 Grocery"><span class="role">Supplier invites</span></div></header>
<div class="wrap"><main id="app"><div class="empty">Loading…</div></main></div>
<script>
const params = new URLSearchParams(location.search);
const API = (/^http:\/\/(localhost|127\.0\.0\.1):\d+$/.test(params.get('api') || '') ? params.get('api') : 'https://jssnhzkyhtobhuogddeq.supabase.co/functions/v1/api');
const K = params.get('k') || '';
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkFor = (t) => new URL(`supplier.html?t=${t}`, location.href).href;
const unnamed = (s) => /^Supplier \d+$/.test(s.name);
const invite = (s) => `Hi ${s.name}! This is 888 Grocery.\n\nPlease open this link and type the price you charge us for each item you supply. Leave blank any item you don't have. You can open the same link again any time to update your prices.\n\n${linkFor(s.link_token)}\n\nThank you!`;
let data = null, flash = {};

async function api(method, body) {
  const res = await fetch(`${API}/sinvite${method === 'GET' ? '?k=' + encodeURIComponent(K) : ''}`, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify({ k: K, ...body }) : undefined });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
  return j;
}
function status(s) {
  if (!s.priced) return `<div class="status">Not started yet · 0 of ${data.total} items${s.last_seen_at ? ' · opened the link' : ''}</div>`;
  if (s.priced >= data.total) return `<div class="status full">Full list · ${s.priced} of ${data.total} items</div>`;
  return `<div class="status part">Part of the list · ${s.priced} of ${data.total} items</div>`;
}
function render() {
  app.innerHTML = `<div class="card"><h2>Invite suppliers</h2>
      <ol class="steps-how"><li>Type the shop's <b>name</b> (and town and phone) in one box below.</li><li>Tap <b>Save name</b>.</li><li>Tap <b>Copy invite</b>, then paste it in Messenger or Viber to that shop. Or tap <b>Send by text</b>.</li><li>One box = one shop. Use a new box for each shop.</li></ol></div>
    ${data.suppliers.map((s, i) => `<div class="card slot" data-id="${s.id}">
      <h3>Box ${i + 1}<small>${unnamed(s) ? 'not named yet' : esc(s.name)}</small></h3>
      <div class="grid2"><label class="field">Shop name<input name="name" value="${unnamed(s) ? '' : esc(s.name)}" placeholder="e.g. Aling Nena Store" maxlength="80"></label>
        <label class="field">Town<input name="location" value="${esc(s.location || '')}" placeholder="e.g. Masinloc" maxlength="80"></label></div>
      <label class="field">Phone<input name="contact" value="${esc(s.contact || '')}" inputmode="tel" placeholder="e.g. 0917 123 4567" maxlength="120"></label>
      <div class="row"><button class="btn" data-act="save">Save name</button></div>
      ${unnamed(s) ? '<p class="hint">Save the shop name first. Then you can send the invite.</p>' : `<div class="row">
        <button class="btn primary" data-act="copy">Copy invite</button>
        <a class="btn" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center" href="sms:${encodeURIComponent((s.contact || '').replace(/[^\d+]/g, ''))}?&body=${encodeURIComponent(invite(s))}">Send by text</a></div>`}
      ${flash[s.id] ? `<div class="done">${esc(flash[s.id])}</div>` : ''}
      ${status(s)}</div>`).join('')}
    <div style="margin:16px 0 28px"><button class="btn" data-act="add" style="width:100%">+ Add another box</button></div>`;
}

app.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const card = b.closest('[data-id]'), id = card?.dataset.id, s = data.suppliers.find((x) => x.id === id);
  try {
    if (b.dataset.act === 'save') {
      const f = (n) => card.querySelector(`[name=${n}]`).value;
      if (!f('name').trim()) { alert('Type the shop name first.'); return; }
      b.disabled = true; data = await api('POST', { act: 'rename', id, name: f('name'), location: f('location'), contact: f('contact') });
      flash = { [id]: 'Saved.' }; render();
    }
    if (b.dataset.act === 'copy') {
      try { await navigator.clipboard.writeText(invite(s)); flash = { [id]: 'Copied! Now paste it in Messenger or Viber.' }; render(); }
      catch { prompt('Copy this message:', invite(s)); }
    }
    if (b.dataset.act === 'add') { b.disabled = true; data = await api('POST', { act: 'add' }); flash = {}; render(); window.scrollTo(0, document.body.scrollHeight); }
  } catch (err) { alert(err.message); b.disabled = false; }
});

(async () => {
  if (!K) { app.innerHTML = '<div class="empty">Please open the link 888 sent you.</div>'; return; }
  try { data = await api('GET'); render(); }
  catch (err) { app.innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
})();
</script>
</body>
</html>
